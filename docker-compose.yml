services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run npm run setup:env}
      MYSQL_DATABASE: ${DB_NAME:-hkuplanner}
      MYSQL_USER: ${DB_USER:-hkuplanner}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Run npm run setup:env}
    ports:
      - "127.0.0.1:${DB_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h localhost -u root --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
  setup:
    build: .
    profiles: [tools]
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-hkuplanner}
      DB_USER: ${DB_USER:-hkuplanner}
      DB_PASSWORD: ${DB_PASSWORD:?Run npm run setup:env}
      DB_ADMIN_USER: root
      DB_ADMIN_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run npm run setup:env}
    command: ["node", "backend/database/setupDatabase.js"]
    depends_on:
      mysql:
        condition: service_healthy
  app:
    build: .
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      HOST: 0.0.0.0
      PORT: 3001
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:3001}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:3001,http://127.0.0.1:5173}
      CURSOR_SECRET: ${CURSOR_SECRET:?Run npm run setup:env}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-hkuplanner}
      DB_USER: ${DB_USER:-hkuplanner}
      DB_PASSWORD: ${DB_PASSWORD:?Run npm run setup:env}
    ports:
      - "${APP_HOST:-127.0.0.1}:${PORT:-3001}:3001"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
volumes:
  mysql_data:
